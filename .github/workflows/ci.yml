name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cài ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Unit test (offline) + coverage
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=88

  frontend:
    name: Frontend (type + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: "E2E (Playwright, iPhone / iPad / desktop, trợ năng, PWA)"
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Chạy E2E
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
        run: npx playwright test
      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7

  docker:
    name: Docker image (build; đẩy lên Docker Hub khi push main hoặc tag v*)
    needs: [backend, frontend, e2e] # chỉ đẩy image đã qua toàn bộ kiểm thử
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: lanntxyz/yt-dl
      # secret không dùng trực tiếp trong `if` được nên ánh xạ qua env
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Quyết định có đẩy image không
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; }; then
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
              echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Chưa cấu hình secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN nên chỉ build thử, không đẩy image."
          fi
          echo "push=false" >> "$GITHUB_OUTPUT"
          echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"

      # arm64 (Raspberry Pi) được build bằng QEMU; chỉ cần khi thực sự đẩy image
      - uses: docker/setup-qemu-action@v3
        if: steps.cfg.outputs.push == 'true'
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.cfg.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tạo tag cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # tắt attestation để Docker Hub không hiện thêm các mục "unknown/unknown"
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
