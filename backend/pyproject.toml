[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
addopts = "-m 'not network and not slow'"
markers = [
    "network: gọi YouTube thật (chỉ chạy khi chọn -m network)",
    "slow: test chậm",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
