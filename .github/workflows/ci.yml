name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cài ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Unit test (offline) + coverage
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=88

  frontend:
    name: Frontend (type + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  e2e:
    name: "E2E (Playwright, iPhone / iPad / desktop, trợ năng, PWA)"
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Chạy E2E
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
        run: npx playwright test
      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/e2e/.report
            frontend/e2e/.results
          retention-days: 7

  # Chỉ build thử (amd64) trên nhánh/PR, không cần environment hay secrets
  docker:
    name: Docker image (build thử)
    needs: [backend, frontend]
    if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Đẩy image lên Docker Hub khi push main hoặc tag v*. Chạy trong environment "PERSONAL" nên đọc được secrets
  # đặt ở đó (và cả secrets cấp repo). Chỉ chạy sau khi toàn bộ kiểm thử xanh.
  publish:
    name: Docker image (build + đẩy lên Docker Hub)
    needs: [backend, frontend, e2e]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    environment: PERSONAL
    permissions:
      contents: read
    outputs:
      pushed: ${{ steps.cfg.outputs.push }} # job deploy chỉ chạy khi image thật sự đã được đẩy
    env:
      IMAGE: lanntxyz/yt-dl
      # secret không dùng trực tiếp trong `if` được nên ánh xạ qua env
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Kiểm tra secrets Docker Hub
        id: cfg
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            # Chỉ in TÊN các secret job nhìn thấy (không bao giờ in giá trị) để dễ phát hiện đặt sai tên/sai nơi lưu
            names="$(printf '%s' "$ALL_SECRETS" | jq -r 'del(.github_token) | keys | join(", ")')"
            echo "::warning::Secrets job nhìn thấy (chỉ tên): [${names:-không có}]. Cần có đúng DOCKERHUB_USERNAME và DOCKERHUB_TOKEN."
            echo "::warning::Thiếu secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (trong environment PERSONAL hoặc cấp repo) nên chỉ build thử, không đẩy image."
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      # arm64 (Raspberry Pi) được build bằng QEMU; chỉ cần khi thực sự đẩy image
      - uses: docker/setup-qemu-action@v3
        if: steps.cfg.outputs.push == 'true'
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.cfg.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tạo tag cho image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.cfg.outputs.platforms }}
          push: ${{ steps.cfg.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # tắt attestation để Docker Hub không hiện thêm các mục "unknown/unknown"
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy lên Pi qua SSH (pull image + khởi động lại container)
    needs: publish
    if: needs.publish.outputs.pushed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Secrets SSH đọc từ environment "PERSONAL" (hoặc cấp repo). Bật "Required reviewers" ở
    # Settings → Environments → PERSONAL nếu muốn duyệt tay trước mỗi lần deploy.
    environment: PERSONAL
    concurrency:
      group: deploy-production
      cancel-in-progress: false # không hủy lần deploy đang chạy dở
    env:
      HAS_SSH: ${{ secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_PRIVATE_KEY != '' && secrets.SSH_KNOWN_HOSTS != '' && secrets.DEPLOY_PATH != '' }}
      HAS_TAILSCALE: ${{ secrets.TS_OAUTH_CLIENT_ID != '' && secrets.TS_OAUTH_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts # chỉ cần scripts/deploy.sh

      - name: Kiểm tra cấu hình deploy
        id: cfg
        run: |
          if [ "$HAS_SSH" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Bỏ qua deploy: thiếu một trong các secrets SSH_HOST, SSH_USER, SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, DEPLOY_PATH."
          fi

      # Tùy chọn: nếu Pi chỉ truy cập được qua Tailscale, đưa runner vào tailnet trước khi SSH
      - name: Kết nối Tailscale (tùy chọn)
        if: steps.cfg.outputs.run == 'true' && env.HAS_TAILSCALE == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Cấu hình SSH
        if: steps.cfg.outputs.run == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Xác thực máy chủ bằng known_hosts đã lưu sẵn (không dùng ssh-keyscan lúc chạy để tránh bị giả mạo)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        if: steps.cfg.outputs.run == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          printf -v dp '%q' "$DEPLOY_PATH"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH=$dp sh -s" < scripts/deploy.sh

      - name: Xóa khóa SSH khỏi runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
