# Chạy:  cp .env.example .env  (sửa mật khẩu)  &&  docker compose up -d --build
# Bật HTTPS công khai bằng Caddy:  docker compose --profile https up -d
services:
  app:
    build: .
    # Image dựng sẵn trên Docker Hub (docker compose pull); `up -d --build` vẫn tự build từ source và gán đúng tên này
    image: lanntxyz/yt-dl:${YT_IMAGE_TAG:-latest}
    container_name: yt-mp3-web
    restart: unless-stopped
    env_file: .env
    environment:
      YT_DATA_DIR: /data
    volumes:
      # Nên trỏ tới SSD/USB thay vì thẻ SD (ghi nhiều). Mặc định: thư mục ./data
      - ${YT_DATA_HOST_DIR:-./data}:/data
    # ports:
    #   # Chỉ mở trong máy; truy cập từ xa qua Tailscale Serve hoặc Caddy (xem docs/DEPLOY-PI.md)
    #   - "127.0.0.1:${YT_PORT:-8000}:8000"
    mem_limit: 1g
    cpus: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shared_network

networks:
  shared_network:
    external: true
